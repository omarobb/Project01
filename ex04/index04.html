<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <body>
        <form>
            <label for="Fname">FULL Name:</label>
            <input type="text" id="Fname" name="Fname" required minlength="2"><br>
            <label for="Email">Email:</label>
            <input type="email" id="Email" name="Email" required><br>
            <label for="Password">Password:</label>
            <input type="password" id="Password" name="Password" required minlength="8"><br>
            <label for="Radio">Gender</label>
            <select id="Radio" name="Radio" required>
                <option value="male">Male</option>
                <option value="Female">Female</option>
            </select>
            <br>
            <label for="suggest">Suggest:</label><br>
            <textarea id="suggest" name="suggest" minlength="10">any suggest?</textarea><br>
            <input type="Checkbox" id="checkbox" name="checkbox">
            <label for="checkbox">agree</label><br>
        </form>
    </body>
